{% extends "base.html" %}
{% import "_macros.html" as ui %}
{% block title %}Write a review{% endblock %}
{% block content %}
<div class="container" style="max-width: 640px;">
  <h1 class="h3 mb-4"><i class="bi bi-star text-accent"></i> Rate your service</h1>
  <div class="app-card p-4 mb-3">{{ ui.booking_summary(booking, 'provider') }}</div>
  <form method="post" class="app-card p-4" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="form-label d-block">Your rating</label>
    <div class="rating-picker mb-3">
      {% for i in range(5, 0, -1) %}
        <input type="radio" name="rating" id="star-{{ i }}" value="{{ i }}" required>
        <label for="star-{{ i }}" title="{{ i }} star"><i class="bi bi-star-fill"></i></label>
      {% endfor %}
    </div>
    <label class="form-label" for="comment">Your review</label>
    <textarea class="form-control mb-3" id="comment" name="comment" rows="4" maxlength="1000"
              placeholder="How was the service? Was the provider on time and polite?"></textarea>
    <button class="btn btn-accent" type="submit"><i class="bi bi-send"></i> Submit review</button>
  </form>
</div>
{% endblock %}
