{% extends "base.html" %}
{% block title %}Provider Profile{% endblock %}
{% block content %}
<div class="container" style="max-width: 760px;">
  <h1 class="h3 mb-1"><i class="bi bi-person-badge text-accent"></i> My profile</h1>
  <p class="text-muted-soft mb-4">Status:
    <span class="badge status-{{ provider.verification_status }} {{ 'bg-warning text-dark' if provider.verification_status == 'pending' }}">
      {{ provider.verification_status|title }}</span></p>
  <form method="post" class="app-card p-4" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label" for="name">Full name</label>
        <input class="form-control" id="name" name="name" value="{{ user.name }}" maxlength="100" required>
      </div>
      <div class="col-md-6">
        <label class="form-label">Email</label>
        <input class="form-control" value="{{ user.email }}" disabled>
      </div>
      <div class="col-md-4">
        <label class="form-label" for="phone">Phone (10 digits)</label>
        <input class="form-control" id="phone" name="phone" value="{{ user.phone or '' }}" maxlength="10" required>
      </div>
      <div class="col-md-4">
        <label class="form-label" for="city">City you work in</label>
        <input class="form-control" id="city" name="city" value="{{ provider.city }}" maxlength="60" required>
      </div>
      <div class="col-md-4">
        <label class="form-label" for="experience_years">Experience (years)</label>
        <input type="number" class="form-control" id="experience_years" name="experience_years"
               value="{{ provider.experience_years }}" min="0" max="60" required>
      </div>
      <div class="col-12">
        <label class="form-label" for="bio">Bio</label>
        <textarea class="form-control" id="bio" name="bio" rows="3" maxlength="500">{{ provider.bio or '' }}</textarea>
      </div>
      <div class="col-12">
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" role="switch" id="is_available" name="is_available" value="1"
                 {{ 'checked' if provider.is_available }}>
          <label class="form-check-label" for="is_available">Available for new bookings</label>
        </div>
      </div>
    </div>
    <button class="btn btn-accent mt-4" type="submit"><i class="bi bi-save"></i> Save changes</button>
  </form>
</div>
{% endblock %}
