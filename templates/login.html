{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="container">
  <div class="app-card auth-card mx-auto p-4 p-md-5">
    <h1 class="h3 mb-1">Welcome back</h1>
    <p class="text-muted-soft mb-4">Log in to manage your bookings.</p>
    <form method="post" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <input type="email" class="form-control" id="email" name="email" value="{{ email }}" required autofocus>
      </div>
      <div class="mb-4">
        <label class="form-label" for="password">Password</label>
        <input type="password" class="form-control" id="password" name="password" required>
      </div>
      <button class="btn btn-accent w-100" type="submit">Log in</button>
    </form>
    <p class="text-center small mt-4 mb-0">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
  </div>
</div>
{% endblock %}
