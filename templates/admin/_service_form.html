{# Shared add/edit form for a service. `service` is empty when adding. #}
{% set s = service if service is defined else {} %}
<form method="post" novalidate>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="mb-3">
    <label class="form-label" for="name">Name</label>
    <input class="form-control" id="name" name="name" value="{{ s.name or '' }}" maxlength="60" required>
  </div>
  <div class="mb-3">
    <label class="form-label" for="description">Description</label>
    <input class="form-control" id="description" name="description" value="{{ s.description or '' }}" maxlength="255">
  </div>
  <div class="mb-3">
    <label class="form-label" for="icon">Bootstrap icon class</label>
    <input class="form-control" id="icon" name="icon" value="{{ s.icon or 'bi-tools' }}" maxlength="50">
    <div class="form-text">See icons.getbootstrap.com, e.g. bi-droplet</div>
  </div>
  <div class="mb-3">
    <label class="form-label" for="base_price">Base price (₹)</label>
    <input type="number" class="form-control" id="base_price" name="base_price" value="{{ s.base_price or '' }}" min="1" step="1" required>
  </div>
  <button class="btn btn-accent w-100" type="submit"><i class="bi bi-save"></i> Save</button>
</form>
